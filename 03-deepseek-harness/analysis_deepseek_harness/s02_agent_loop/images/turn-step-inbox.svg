<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6b7b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="440" fill="#fafbfc"/>
  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#24292f">agent-loop：轮次 / 步骤两级状态机 + inbox 唤醒分类</text>

  <!-- inbox -->
  <rect x="40" y="70" width="240" height="180" rx="10" fill="#fdf6ec" stroke="#c98a2b" stroke-width="2"/>
  <text x="160" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a5a12">inbox（收件箱，事件溯源）</text>
  <rect x="60" y="112" width="200" height="40" rx="6" fill="#ffffff" stroke="#dcb67a"/>
  <text x="160" y="137" text-anchor="middle" font-size="13" fill="#24292f">next-turn：[]　（下一轮）</text>
  <rect x="60" y="164" width="200" height="40" rx="6" fill="#ffffff" stroke="#dcb67a"/>
  <text x="160" y="189" text-anchor="middle" font-size="13" fill="#24292f">next-step：[]　（下一步）</text>
  <text x="160" y="232" text-anchor="middle" font-size="12" fill="#8a5a12">唯一写操作 = splice（全落日志）</text>

  <!-- wake classification -->
  <rect x="40" y="270" width="240" height="130" rx="10" fill="#ffffff" stroke="#c98a2b" stroke-dasharray="5 3"/>
  <text x="160" y="296" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a5a12">四种唤醒入口</text>
  <text x="62" y="322" font-size="12.5" fill="#24292f">send　　→ next-turn（唤醒）</text>
  <text x="62" y="344" font-size="12.5" fill="#24292f">steer　 → next-step（步间插话）</text>
  <text x="62" y="366" font-size="12.5" fill="#24292f">inject　→ next-step（静默注入）</text>
  <text x="62" y="388" font-size="12.5" fill="#24292f">followup→ next-turn（排队）</text>

  <!-- turn box -->
  <rect x="360" y="66" width="480" height="180" rx="10" fill="#eef4fb" stroke="#4a78b5" stroke-width="2"/>
  <text x="600" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b5985">turn（轮）：turn/start → … → turn/end</text>
  <rect x="390" y="112" width="180" height="56" rx="6" fill="#ffffff" stroke="#8fb3d9"/>
  <text x="480" y="135" text-anchor="middle" font-size="13" fill="#24292f">step/start</text>
  <text x="480" y="155" text-anchor="middle" font-size="11.5" fill="#6a737d">从日志推导请求</text>
  <rect x="620" y="112" width="180" height="56" rx="6" fill="#ffffff" stroke="#8fb3d9"/>
  <text x="710" y="135" text-anchor="middle" font-size="13" fill="#24292f">流式收模型</text>
  <text x="710" y="155" text-anchor="middle" font-size="11.5" fill="#6a737d">assistant/message 落日志</text>
  <rect x="390" y="182" width="180" height="50" rx="6" fill="#ffffff" stroke="#8fb3d9"/>
  <text x="480" y="203" text-anchor="middle" font-size="13" fill="#24292f">tool/call → tool/result</text>
  <text x="480" y="222" text-anchor="middle" font-size="11.5" fill="#6a737d">（s05 的流水线）</text>
  <rect x="620" y="182" width="180" height="50" rx="6" fill="#ffffff" stroke="#8fb3d9"/>
  <text x="710" y="203" text-anchor="middle" font-size="13" fill="#24292f">步间收信（claim）</text>
  <text x="710" y="222" text-anchor="middle" font-size="11.5" fill="#6a737d">steer 在这里进本轮</text>
  <line x1="570" y1="140" x2="615" y2="140" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="710" y1="168" x2="540" y2="180" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="570" y1="207" x2="615" y2="207" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- loop arrows -->
  <path d="M 600 246 C 600 280 600 280 600 288" fill="none" stroke="#4a78b5" stroke-width="2" marker-end="url(#arr)"/>
  <text x="700" y="272" text-anchor="middle" font-size="12.5" fill="#4a78b5">模型还要调工具 → 下一个 step（循环）</text>
  <rect x="360" y="292" width="480" height="64" rx="10" fill="#eefaf0" stroke="#3d9a50" stroke-width="2"/>
  <text x="600" y="318" text-anchor="middle" font-size="13.5" fill="#2c7a3f">模型不调工具 → step/end(completed) → turn/end</text>
  <text x="600" y="342" text-anchor="middle" font-size="12.5" fill="#8a5a12">粘性结局：轮内任何一步撞过 max-tokens，turn/end 就是 max-tokens</text>

  <!-- inbox feeding -->
  <line x1="280" y1="160" x2="355" y2="130" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="318" y="118" text-anchor="middle" font-size="12.5" fill="#24292f">claim（取走，非复制）</text>

  <text x="440" y="404" text-anchor="middle" font-size="13" fill="#6a737d">对应真实源码：packages/core/agent-loop/src/agent.ts（kick :225 · turn :269 · step :352）与 inbox.ts</text>
  <text x="440" y="426" text-anchor="middle" font-size="12" fill="#8250df">头部注释即设计承诺："Every request is derived from the session log."</text>
</svg>
