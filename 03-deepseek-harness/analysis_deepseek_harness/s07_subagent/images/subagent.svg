<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6b7b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="420" fill="#fafbfc"/>
  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#24292f">子代理：过程不可见、结论可见</text>

  <!-- parent -->
  <rect x="45" y="66" width="380" height="290" rx="10" fill="#eef4fb" stroke="#4a78b5" stroke-width="2"/>
  <text x="235" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b5985">父 loop（session: parent）</text>
  <text x="235" y="122" text-anchor="middle" font-size="12.5" fill="#24292f">模型看到 spawn 只是一个普通工具</text>
  <rect x="75" y="140" width="320" height="34" rx="6" fill="#ffffff" stroke="#8fb3d9"/>
  <text x="235" y="162" text-anchor="middle" font-size="12.5" fill="#24292f">tool/call：spawn("explore", "查清 X")</text>
  <rect x="75" y="188" width="320" height="40" rx="6" fill="#ffffff" stroke="#8fb3d9"/>
  <text x="235" y="208" text-anchor="middle" font-size="12.5" fill="#24292f">tool/result：【explore 汇报】结论……</text>
  <text x="235" y="224" text-anchor="middle" font-size="11" fill="#6a737d">只有总结，没有子代理的工具细节</text>
  <rect x="75" y="242" width="320" height="30" rx="6" fill="#f6f8fa" stroke="#c9d4de"/>
  <text x="235" y="262" text-anchor="middle" font-size="12" fill="#24292f">父日志：#1 assistant · #2 tool/call · #3 tool/result</text>
  <text x="235" y="304" text-anchor="middle" font-size="12" fill="#2b5985">上下文隔离：子过程不占父窗口</text>
  <text x="235" y="326" text-anchor="middle" font-size="12" fill="#2b5985">审计隔离：父日志不含子日志</text>

  <!-- catalog -->
  <rect x="45" y="368" width="380" height="40" rx="8" fill="#fdf6ec" stroke="#c98a2b"/>
  <text x="235" y="393" text-anchor="middle" font-size="12.5" fill="#8a5a12">subagent/catalog：explore · plan · …（进 s04 提示词）</text>

  <!-- provider seam -->
  <rect x="500" y="140" width="180" height="140" rx="10" fill="#f3eefe" stroke="#8250df" stroke-width="2"/>
  <text x="590" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#6639ba">provider seam</text>
  <text x="590" y="196" text-anchor="middle" font-size="12" fill="#24292f">fork-in-process</text>
  <text x="590" y="218" text-anchor="middle" font-size="12" fill="#24292f">claude-code 适配器</text>
  <text x="590" y="240" text-anchor="middle" font-size="12" fill="#24292f">codex 适配器 / acp / sdk</text>
  <text x="590" y="266" text-anchor="middle" font-size="11.5" fill="#6639ba">别家 harness 也是 provider</text>
  <line x1="425" y1="200" x2="495" y2="200" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="460" y="188" text-anchor="middle" font-size="12" fill="#24292f">fork(desc)</text>

  <!-- child -->
  <rect x="700" y="66" width="160" height="290" rx="10" fill="#eefaf0" stroke="#3d9a50" stroke-width="2"/>
  <text x="780" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c7a3f">子 loop</text>
  <text x="780" y="120" text-anchor="middle" font-size="12" fill="#24292f">独立会话日志</text>
  <text x="780" y="144" text-anchor="middle" font-size="12" fill="#24292f">工具白名单（desc.tools）</text>
  <text x="780" y="168" text-anchor="middle" font-size="12" fill="#24292f">自己的模型/作用域</text>
  <rect x="715" y="186" width="130" height="120" rx="6" fill="#ffffff" stroke="#93c9a0"/>
  <text x="780" y="210" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#24292f">step1 tool/call</text>
  <text x="780" y="234" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#24292f">step1 tool/result</text>
  <text x="780" y="258" text-anchor="middle" font-size="11.5" font-family="Consolas, monospace" fill="#24292f">step2 汇报收尾</text>
  <text x="780" y="300" text-anchor="middle" font-size="11.5" fill="#2c7a3f">权限隔离：没有</text>
  <text x="780" y="320" text-anchor="middle" font-size="11.5" fill="#2c7a3f">write 权限的 agent</text>
  <line x1="680" y1="210" x2="695" y2="210" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 780 356 C 780 376 460 380 440 356" fill="none" stroke="#3d9a50" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="610" y="384" text-anchor="middle" font-size="11.5" fill="#3d9a50">汇报沿原路返回 = 一条 tool/result</text>

  <text x="440" y="414" text-anchor="middle" font-size="12.5" fill="#6a737d">对应真实源码：packages/subagent/（core · fork-in-process · claude-code/codex/acp/sdk 提供方）｜事件：subagent/catalog · subagent/descriptor</text>
</svg>
