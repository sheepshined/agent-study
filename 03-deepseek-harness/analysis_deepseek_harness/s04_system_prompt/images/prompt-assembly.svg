<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6b7b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="400" fill="#fafbfc"/>
  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#24292f">系统提示词：碎片组装 → 冻结 → 随请求面落日志</text>

  <!-- fragment sources -->
  <rect x="45" y="66" width="250" height="264" rx="10" fill="#eef4fb" stroke="#4a78b5" stroke-width="2"/>
  <text x="170" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b5985">section 碎片（各插件供给）</text>
  <g font-size="12.5" fill="#24292f">
    <rect x="65" y="110" width="210" height="34" rx="6" fill="#ffffff" stroke="#8fb3d9"/><text x="170" y="132" text-anchor="middle">identity（身份）</text>
    <rect x="65" y="152" width="210" height="34" rx="6" fill="#ffffff" stroke="#8fb3d9"/><text x="170" y="174" text-anchor="middle">instructions（AGENTS.md）</text>
    <rect x="65" y="194" width="210" height="34" rx="6" fill="#ffffff" stroke="#8fb3d9"/><text x="170" y="216" text-anchor="middle">context（时间/目录…）</text>
    <rect x="65" y="236" width="210" height="34" rx="6" fill="#fdf6ec" stroke="#dcb67a"/><text x="170" y="258" text-anchor="middle">tools（schema 实时取自注册表）</text>
  </g>
  <text x="170" y="300" text-anchor="middle" font-size="11.5" fill="#6a737d">插件可随时插入自己的 section</text>
  <text x="170" y="318" text-anchor="middle" font-size="11.5" fill="#6a737d">注册表是唯一真源，提示词不存副本</text>

  <!-- assembly -->
  <rect x="380" y="120" width="200" height="120" rx="10" fill="#eefaf0" stroke="#3d9a50" stroke-width="2"/>
  <text x="480" y="150" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2c7a3f">assemble()</text>
  <text x="480" y="176" text-anchor="middle" font-size="12.5" fill="#24292f">joinContextSections</text>
  <text x="480" y="198" text-anchor="middle" font-size="12.5" fill="#24292f">renderPrompt</text>
  <text x="480" y="222" text-anchor="middle" font-size="12" fill="#8a5a12">generation 代际做缓存失效</text>
  <line x1="295" y1="180" x2="375" y2="180" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- frozen output -->
  <rect x="660" y="96" width="190" height="150" rx="10" fill="#f3eefe" stroke="#8250df" stroke-width="2"/>
  <text x="755" y="124" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#6639ba">PromptAssembly</text>
  <text x="755" y="150" text-anchor="middle" font-size="12.5" fill="#24292f">deepFreeze 冻结</text>
  <text x="755" y="172" text-anchor="middle" font-size="12.5" fill="#24292f">随 request/header 落日志</text>
  <text x="755" y="194" text-anchor="middle" font-size="12.5" fill="#24292f">重放即可复原"当时给模型看了什么"</text>
  <text x="755" y="222" text-anchor="middle" font-size="11.5" fill="#6639ba">谁也改不了（防插件篡改请求面）</text>
  <line x1="580" y1="180" x2="655" y2="175" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ptc collapse -->
  <rect x="380" y="272" width="470" height="94" rx="10" fill="#fdf6ec" stroke="#c98a2b" stroke-width="2"/>
  <text x="615" y="298" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a5a12">呈现模式 native ↔ ptc（给模型看的协议）</text>
  <text x="615" y="324" text-anchor="middle" font-size="12.5" fill="#24292f">native：每个工具一个 schema，模型直呼其名</text>
  <text x="615" y="348" text-anchor="middle" font-size="12.5" fill="#24292f">ptc：N 个工具塌缩成 run_code 一个入口 + 契约提示</text>

  <text x="440" y="388" text-anchor="middle" font-size="13" fill="#6a737d">对应真实源码：packages/core/system-prompt/（renderPrompt · joinContextSections · renderContextSections）</text>
</svg>
