<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6b7b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="400" fill="#fafbfc"/>
  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#24292f">LLM 适配缝：流式 → 块组装，瞬态错误 → 指数退避</text>

  <!-- seam -->
  <rect x="40" y="66" width="240" height="270" rx="10" fill="#eef4fb" stroke="#4a78b5" stroke-width="2"/>
  <text x="160" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b5985">adapter seam（ctx.llm）</text>
  <rect x="60" y="110" width="200" height="34" rx="6" fill="#ffffff" stroke="#8fb3d9"/><text x="160" y="132" text-anchor="middle" font-size="12.5">llm-deepseek（官方适配）</text>
  <rect x="60" y="152" width="200" height="34" rx="6" fill="#ffffff" stroke="#8fb3d9"/><text x="160" y="174" text-anchor="middle" font-size="12.5">llm-pi-ai / 其他提供方</text>
  <rect x="60" y="194" width="200" height="34" rx="6" fill="#ffffff" stroke="#8fb3d9"/><text x="160" y="216" text-anchor="middle" font-size="12.5">Mock（测试 / 课程）</text>
  <text x="160" y="256" text-anchor="middle" font-size="12" fill="#24292f">统一词汇表：Message / Block /</text>
  <text x="160" y="276" text-anchor="middle" font-size="12" fill="#24292f">LlmCallConfig（adapterDefaults）</text>
  <text x="160" y="308" text-anchor="middle" font-size="11.5" fill="#2b5985">循环只认 seam，不认厂商</text>

  <!-- retry loop -->
  <rect x="360" y="66" width="220" height="270" rx="10" fill="#fdf6ec" stroke="#c98a2b" stroke-width="2"/>
  <text x="470" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a5a12">retry-policy</text>
  <text x="470" y="124" text-anchor="middle" font-size="12.5" fill="#24292f">429 / 5xx / 网络抖动 = 瞬态</text>
  <text x="470" y="148" text-anchor="middle" font-size="12.5" fill="#24292f">指数退避：20ms → 40ms → …</text>
  <text x="470" y="172" text-anchor="middle" font-size="12.5" fill="#24292f">每次重试落 llm/retry 事件</text>
  <text x="470" y="204" text-anchor="middle" font-size="12" fill="#b35900">流中途断 → 已收 delta 作废</text>
  <text x="470" y="226" text-anchor="middle" font-size="12" fill="#b35900">整次调用从头再来</text>
  <text x="470" y="258" text-anchor="middle" font-size="11.5" fill="#8a5a12">参数错误不重试 —— 重试一万次</text>
  <text x="470" y="278" text-anchor="middle" font-size="11.5" fill="#8a5a12">也不会好（isTransient 闸门）</text>
  <text x="470" y="312" text-anchor="middle" font-size="11.5" fill="#6a737d">对应 llm/llm-retry + retry-policy.ts</text>

  <!-- assembler -->
  <rect x="640" y="66" width="210" height="270" rx="10" fill="#eefaf0" stroke="#3d9a50" stroke-width="2"/>
  <text x="745" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c7a3f">BlockAssembler</text>
  <text x="745" y="124" text-anchor="middle" font-size="12.5" fill="#24292f">text_delta… → text 块</text>
  <text x="745" y="148" text-anchor="middle" font-size="12.5" fill="#24292f">tool_call_delta（按 index 归位）</text>
  <text x="745" y="172" text-anchor="middle" font-size="12.5" fill="#24292f">name/args 分片拼接</text>
  <text x="745" y="204" text-anchor="middle" font-size="12" fill="#2c7a3f">finish() → 结构化 blocks</text>
  <text x="745" y="226" text-anchor="middle" font-size="12" fill="#2c7a3f">+ stopReason 交给循环</text>
  <text x="745" y="260" text-anchor="middle" font-size="11.5" fill="#6a737d">token-meter 按调用计量</text>
  <text x="745" y="280" text-anchor="middle" font-size="11.5" fill="#6a737d">（含缓存命中计费差）</text>
  <text x="745" y="312" text-anchor="middle" font-size="11.5" fill="#6a737d">对应 llm/assembler.ts</text>

  <line x1="280" y1="200" x2="355" y2="200" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="580" y1="200" x2="635" y2="200" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arr)"/>

  <text x="440" y="372" text-anchor="middle" font-size="13" fill="#6a737d">adapterDefaults：adapter 声明自管参数（如 reasoningEffort），插件提议配置前先剥离 —— 改了也白改的参数干脆不让改</text>
  <text x="440" y="394" text-anchor="middle" font-size="12" fill="#8250df">对应 agent.ts :501 requestProposal ｜ 事件词汇表：llm/retry · llm/retry-started</text>
</svg>
