<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6b7b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="440" fill="#fafbfc"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#24292f">rollout：会话黑匣子 —— 只追加，重放即重建</text>

  <!-- left: recording -->
  <rect x="50" y="70" width="250" height="280" rx="10" fill="#eef4fb" stroke="#4a78b5" stroke-width="2"/>
  <text x="175" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b5985">会话进行中（录制）</text>
  <rect x="70" y="116" width="210" height="34" rx="6" fill="#ffffff" stroke="#8fb3d9"/>
  <text x="175" y="138" text-anchor="middle" font-size="12.5" fill="#24292f">session_meta（元信息）</text>
  <rect x="70" y="158" width="210" height="34" rx="6" fill="#ffffff" stroke="#8fb3d9"/>
  <text x="175" y="180" text-anchor="middle" font-size="12.5" fill="#24292f">response_item（用户/工具/助手）</text>
  <rect x="70" y="200" width="210" height="34" rx="6" fill="#ffffff" stroke="#8fb3d9"/>
  <text x="175" y="222" text-anchor="middle" font-size="12.5" fill="#24292f">turn_context（回合配置）</text>
  <rect x="70" y="242" width="210" height="34" rx="6" fill="#fff7e6" stroke="#d9a03c"/>
  <text x="175" y="264" text-anchor="middle" font-size="12.5" fill="#24292f">compacted（压缩标记）</text>
  <rect x="70" y="284" width="210" height="50" rx="6" fill="#f6f8fa" stroke="#c9d4de" stroke-dasharray="4 3"/>
  <text x="175" y="305" text-anchor="middle" font-size="12" fill="#b35900">修正 / 撤销 / 压缩 也是新条目</text>
  <text x="175" y="323" text-anchor="middle" font-size="12" fill="#b35900">旧条目永不动（append-only）</text>

  <!-- middle: file -->
  <rect x="350" y="110" width="180" height="200" rx="8" fill="#f0f7ee" stroke="#3d9a50" stroke-width="2"/>
  <text x="440" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c7a3f">rollout JSONL</text>
  <text x="440" y="160" text-anchor="middle" font-size="11" fill="#6a737d">{"ordinal":0, item}</text>
  <text x="440" y="180" text-anchor="middle" font-size="11" fill="#6a737d">{"ordinal":1, item}</text>
  <text x="440" y="200" text-anchor="middle" font-size="11" fill="#6a737d">{"ordinal":2, item}</text>
  <text x="440" y="220" text-anchor="middle" font-size="11" fill="#6a737d">…</text>
  <text x="440" y="248" text-anchor="middle" font-size="12" fill="#2c7a3f">行级追加 + flush</text>
  <text x="440" y="268" text-anchor="middle" font-size="12" fill="#b35900">尾部半行：重放时跳过</text>
  <text x="440" y="288" text-anchor="middle" font-size="12" fill="#6a737d">（崩溃残页不致命）</text>

  <!-- right: replay -->
  <rect x="580" y="70" width="230" height="280" rx="10" fill="#eefaf0" stroke="#3d9a50" stroke-width="2"/>
  <text x="695" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c7a3f">重放（重建）</text>
  <rect x="600" y="116" width="190" height="40" rx="6" fill="#ffffff" stroke="#93c9a0"/>
  <text x="695" y="133" text-anchor="middle" font-size="12.5" fill="#24292f">resume：崩溃/重启后续聊</text>
  <text x="695" y="149" text-anchor="middle" font-size="10.5" fill="#6a737d">InitialHistory::Resumed</text>
  <rect x="600" y="166" width="190" height="40" rx="6" fill="#ffffff" stroke="#93c9a0"/>
  <text x="695" y="183" text-anchor="middle" font-size="12.5" fill="#24292f">fork：取前缀开新分支</text>
  <text x="695" y="199" text-anchor="middle" font-size="10.5" fill="#6a737d">InitialHistory::Forked</text>
  <rect x="600" y="216" width="190" height="40" rx="6" fill="#ffffff" stroke="#93c9a0"/>
  <text x="695" y="233" text-anchor="middle" font-size="12.5" fill="#24292f">审计 / 回放 / 评测对齐</text>
  <text x="695" y="249" text-anchor="middle" font-size="10.5" fill="#6a737d">重放 N 次 = N 个相同状态</text>
  <rect x="600" y="266" width="190" height="64" rx="6" fill="#f6f8fa" stroke="#c9d4de" stroke-dasharray="4 3"/>
  <text x="695" y="288" text-anchor="middle" font-size="12" fill="#24292f">投影：compacted 之后</text>
  <text x="695" y="306" text-anchor="middle" font-size="12" fill="#24292f">被折叠条目不再渲染</text>
  <text x="695" y="322" text-anchor="middle" font-size="11" fill="#b35900">日志不动，投影动</text>

  <!-- arrows -->
  <line x1="300" y1="200" x2="345" y2="200" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="322" y="190" text-anchor="middle" font-size="11.5" fill="#24292f">append</text>
  <line x1="530" y1="200" x2="575" y2="200" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="552" y="190" text-anchor="middle" font-size="11.5" fill="#24292f">read</text>

  <!-- bottom -->
  <rect x="50" y="374" width="760" height="44" rx="8" fill="#f6f8fa" stroke="#c9d4de"/>
  <text x="430" y="393" text-anchor="middle" font-size="12.5" fill="#24292f">真实源码：codex-rs/history/src/lib.rs（RolloutItem :122 / RolloutLine :262）· codex-rs/rollout/src/recorder.rs（RolloutRecorder :86）</text>
  <text x="430" y="411" text-anchor="middle" font-size="12" fill="#6a737d">重建消费方：core/src/session/rollout_reconstruction.rs ｜ 行号以当前检出为准，上游会漂移</text>
</svg>
