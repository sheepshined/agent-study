<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6b7b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="400" fill="#fafbfc"/>
  <text x="440" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#24292f">工具双轨 schema 与边流式边执行的准入闸门</text>

  <!-- dual track -->
  <rect x="40" y="58" width="380" height="120" rx="10" fill="#eef4fb" stroke="#4a78b5" stroke-width="2"/>
  <text x="230" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b5985">双轨 schema（bash.ts:6/:76）</text>
  <rect x="60" y="96" width="160" height="62" rx="8" fill="#ffffff" stroke="#4a78b5"/>
  <text x="140" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5985">zod schema</text>
  <text x="140" y="138" text-anchor="middle" font-size="11" fill="#24292f">运行时校验 + TS 类型</text>
  <text x="140" y="152" text-anchor="middle" font-size="10.5" fill="#6a737d">内部用 · 随代码演进</text>
  <rect x="240" y="96" width="160" height="62" rx="8" fill="#ffffff" stroke="#4a78b5"/>
  <text x="320" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5985">手写 JSON Schema</text>
  <text x="320" y="138" text-anchor="middle" font-size="11" fill="#24292f">下发 provider 的契约</text>
  <text x="320" y="152" text-anchor="middle" font-size="10.5" fill="#6a737d">外部用 · 字节稳定护缓存</text>
  <text x="230" y="170" text-anchor="middle" font-size="10.5" fill="#b35900">两轨不互相派生 —— 各自演进、各自负责</text>

  <!-- registry -->
  <rect x="40" y="196" width="380" height="80" rx="10" fill="#eefaf0" stroke="#3d9a50" stroke-width="2"/>
  <text x="230" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c7a3f">注册表 toContracts()（registry.ts:122）</text>
  <text x="230" y="242" text-anchor="middle" font-size="11.5" fill="#24292f">alias→canonical 冲突保护(:47) · 契约冻结 · execute 置空</text>
  <text x="230" y="262" text-anchor="middle" font-size="11.5" fill="#24292f">readOnly / destructive / concurrentSafe / sideEffectScope 随行</text>

  <!-- gate -->
  <rect x="470" y="58" width="370" height="218" rx="10" fill="#fdf6ec" stroke="#c98a2b" stroke-width="2"/>
  <text x="655" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5a12">流中执行闸门（streaming-tool-coordinator.ts:376）</text>
  <g font-size="12" font-family="Consolas, monospace" fill="#24292f">
    <text x="495" y="112">readOnly            === true</text>
    <text x="495" y="134">&amp;&amp; concurrentSafe   === true</text>
    <text x="495" y="156">&amp;&amp; !destructive</text>
    <text x="495" y="178">&amp;&amp; !needsApproval</text>
    <text x="495" y="200">&amp;&amp; !requiresUserInteraction</text>
    <text x="495" y="222">&amp;&amp; sideEffectScope  === "none"</text>
  </g>
  <text x="655" y="248" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a83a32">三处严格等号：readOnly / concurrentSafe / sideEffectScope 未声明 = 拦下</text>
  <text x="655" y="268" text-anchor="middle" font-size="11" fill="#8a5a12">注释自陈："整个提前执行设计唯一的安全边界"</text>

  <!-- flow -->
  <rect x="40" y="292" width="800" height="74" rx="10" fill="#f3eefe" stroke="#8250df" stroke-width="2"/>
  <text x="62" y="316" font-size="13" font-weight="bold" fill="#6639ba">一次调用的旅程（call-runner.ts）</text>
  <text x="62" y="340" font-size="11.5" fill="#24292f">registry 命中 + canonical 化 → 归一化 + schema 校验（zod 优先）→ 工具专属 validateInput → PreToolUse hook → 权限/审批 → 执行+超时 → outputSchema 校验 → 序列化/预算裁剪</text>
  <text x="62" y="358" font-size="11" fill="#6639ba">失败也是结果：早退必须 emitToolCallError 回灌模型 —— 日志无空洞，循环永不因工具而断</text>

  <line x1="230" y1="178" x2="230" y2="190" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="420" y1="236" x2="464" y2="180" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arr)"/>

  <text x="440" y="390" text-anchor="middle" font-size="13" fill="#6a737d">对应真实源码：contracts/src/tools/bash.ts｜core/src/tool/{registry.ts,executor/validation.ts,executor/call-runner.ts}｜runtime/methods/streaming-tool-coordinator.ts</text>
</svg>
