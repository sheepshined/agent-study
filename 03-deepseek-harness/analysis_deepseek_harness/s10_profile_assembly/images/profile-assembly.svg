<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6b7b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="420" fill="#fafbfc"/>
  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#24292f">profile 装配：共享插件层 + 清单差异 + 薄壳</text>

  <!-- shared layer -->
  <rect x="220" y="62" width="440" height="120" rx="10" fill="#eef4fb" stroke="#4a78b5" stroke-width="2"/>
  <text x="440" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b5985">bundle/base（dsh-base）：共享第一层</text>
  <g font-size="12.5" fill="#24292f">
    <rect x="245" y="106" width="90" height="30" rx="6" fill="#ffffff" stroke="#8fb3d9"/><text x="290" y="126" text-anchor="middle">loop</text>
    <rect x="345" y="106" width="90" height="30" rx="6" fill="#ffffff" stroke="#8fb3d9"/><text x="390" y="126" text-anchor="middle">session</text>
    <rect x="445" y="106" width="90" height="30" rx="6" fill="#ffffff" stroke="#8fb3d9"/><text x="490" y="126" text-anchor="middle">tools</text>
    <rect x="545" y="106" width="90" height="30" rx="6" fill="#ffffff" stroke="#8fb3d9"/><text x="590" y="126" text-anchor="middle">llm·sandbox</text>
  </g>
  <text x="440" y="164" text-anchor="middle" font-size="11.5" fill="#6a737d">模型适配器 · 工具 · 持久化 · 沙箱与审批 · 设置（s01–s09 的家当）</text>

  <!-- profiles -->
  <rect x="45" y="236" width="185" height="120" rx="10" fill="#eefaf0" stroke="#3d9a50" stroke-width="2"/>
  <text x="137" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c7a3f">headless 壳</text>
  <text x="137" y="290" text-anchor="middle" font-size="12" fill="#24292f">跑完一轮 → stdout</text>
  <text x="137" y="312" text-anchor="middle" font-size="12" fill="#24292f">CI / 自动化 / 脚本</text>
  <text x="137" y="338" text-anchor="middle" font-size="11.5" fill="#6a737d">bundle/headless</text>

  <rect x="250" y="236" width="185" height="120" rx="10" fill="#fdf6ec" stroke="#c98a2b" stroke-width="2"/>
  <text x="342" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5a12">web 壳</text>
  <text x="342" y="290" text-anchor="middle" font-size="12" fill="#24292f">webserver + 会话控制器</text>
  <text x="342" y="312" text-anchor="middle" font-size="12" fill="#24292f">+ 前端静态资源</text>
  <text x="342" y="338" text-anchor="middle" font-size="11.5" fill="#6a737d">bundle/web-app</text>

  <rect x="455" y="236" width="185" height="120" rx="10" fill="#f3eefe" stroke="#8250df" stroke-width="2"/>
  <text x="547" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#6639ba">sdk 壳</text>
  <text x="547" y="290" text-anchor="middle" font-size="12" fill="#24292f">JSON-RPC 协议面</text>
  <text x="547" y="312" text-anchor="middle" font-size="12" fill="#24292f">被别的程序当库用</text>
  <text x="547" y="338" text-anchor="middle" font-size="11.5" fill="#6639ba">bundle/sdk-app · sdk-minimal</text>

  <rect x="660" y="236" width="185" height="120" rx="10" fill="#fff3f3" stroke="#e3a1a1" stroke-width="2"/>
  <text x="752" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#b02a2a">desktop / acp 壳</text>
  <text x="752" y="290" text-anchor="middle" font-size="12" fill="#24292f">Electron（dsh-app://）</text>
  <text x="752" y="312" text-anchor="middle" font-size="12" fill="#24292f">Agent Client Protocol</text>
  <text x="752" y="338" text-anchor="middle" font-size="11.5" fill="#b02a2a">apps/desktop · bundle/acp-app</text>

  <!-- arrows from shared to profiles -->
  <line x1="330" y1="182" x2="150" y2="230" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="410" y1="182" x2="345" y2="230" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="490" y1="182" x2="545" y2="230" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="560" y1="182" x2="740" y2="230" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- cli boot -->
  <rect x="220" y="376" width="440" height="36" rx="8" fill="#f6f8fa" stroke="#c9d4de"/>
  <text x="440" y="399" text-anchor="middle" font-size="12.5" fill="#24292f">apps/cli 的 `dsh` 命令 = 引导器：选清单 → 装树 → 进壳（`dsh web` / `dsh --profile headless`）</text>
</svg>
