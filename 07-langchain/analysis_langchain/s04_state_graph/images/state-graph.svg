<svg xmlns="http://www.w3.org/2000/svg" width="870" height="470" viewBox="0 0 870 470" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6b7b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="870" height="470" fill="#fafbfc"/>
  <text x="435" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#24292f">mini StateGraph：图是三张表，行走器沿边跑，state 贯穿全程</text>

  <!-- three tables -->
  <rect x="40" y="64" width="250" height="180" rx="10" fill="#eef4fb" stroke="#4a78b5" stroke-width="2"/>
  <text x="165" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b5985">nodes 节点表</text>
  <rect x="60" y="108" width="210" height="38" rx="6" fill="#ffffff" stroke="#8fb3d9"/>
  <text x="165" y="132" text-anchor="middle" font-size="13" fill="#24292f">"model" → 函数</text>
  <rect x="60" y="156" width="210" height="38" rx="6" fill="#ffffff" stroke="#8fb3d9"/>
  <text x="165" y="180" text-anchor="middle" font-size="13" fill="#24292f">"tools" → 函数</text>
  <text x="165" y="222" text-anchor="middle" font-size="11.5" fill="#6a737d">纯函数：state 进，增量补丁出</text>

  <rect x="310" y="64" width="250" height="180" rx="10" fill="#eefaf0" stroke="#3d9a50" stroke-width="2"/>
  <text x="435" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c7a3f">edges 固定边表</text>
  <text x="435" y="126" text-anchor="middle" font-size="13" fill="#24292f">START → model</text>
  <text x="435" y="152" text-anchor="middle" font-size="13" fill="#24292f">tools → model（恒回去）</text>
  <text x="435" y="196" text-anchor="middle" font-size="11.5" fill="#6a737d">无条件跳转，编译期校验端点存在</text>
  <text x="435" y="222" text-anchor="middle" font-size="11.5" fill="#6a737d">（factory.py:1755 的 add_edge）</text>

  <rect x="580" y="64" width="250" height="180" rx="10" fill="#fff8e6" stroke="#bd8a00" stroke-width="2"/>
  <text x="705" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6500">conditional_edges 条件边表</text>
  <text x="705" y="126" text-anchor="middle" font-size="13" fill="#24292f">model ─路由函数→ tools | END</text>
  <text x="705" y="170" text-anchor="middle" font-size="11.5" fill="#6a737d">路由读 state 返回下一个节点名</text>
  <text x="705" y="192" text-anchor="middle" font-size="11.5" fill="#6a737d">目的地必须在声明清单内</text>
  <text x="705" y="222" text-anchor="middle" font-size="11.5" fill="#6a737d">（factory.py:1770/:1790）</text>

  <!-- walker -->
  <rect x="40" y="270" width="790" height="170" rx="10" fill="#f6f8fa" stroke="#c9d4de" stroke-dasharray="4 3"/>
  <text x="435" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#24292f">CompiledGraph.invoke：行走器（场景 3 的真实轨迹）</text>
  <text x="435" y="330" text-anchor="middle" font-size="13" fill="#24292f">model（要点工具）→ tools（执行回填）→ model（最终回答）→ END　路径 = model → tools → model</text>
  <text x="435" y="358" text-anchor="middle" font-size="13" fill="#24292f">每步：state = {**state, **patch}；消息历史只增不改</text>
  <text x="435" y="390" text-anchor="middle" font-size="12.5" fill="#b35900">守卫：recursion_limit——永不收敛的环（场景 5）在 8 步后被强制打断</text>
  <text x="435" y="416" text-anchor="middle" font-size="12" fill="#6a737d">真实引擎在 langgraph 包（factory.py:45 import）；LangChain 只是"声明如何建图"的使用者</text>
</svg>
