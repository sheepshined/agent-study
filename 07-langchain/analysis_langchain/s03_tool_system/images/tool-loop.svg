<svg xmlns="http://www.w3.org/2000/svg" width="870" height="480" viewBox="0 0 870 480" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6b7b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="870" height="480" fill="#fafbfc"/>
  <text x="435" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#24292f">@tool 与工具调用循环：从函数签名到 schema，再按 id 配对闭合</text>

  <!-- reflection pipeline -->
  <rect x="40" y="66" width="790" height="104" rx="10" fill="#eef4fb" stroke="#4a78b5" stroke-width="2"/>
  <text x="66" y="94" font-size="15" font-weight="bold" fill="#2b5985">反射链（@tool 装饰时一次完成）</text>
  <rect x="66" y="110" width="200" height="44" rx="6" fill="#ffffff" stroke="#8fb3d9"/>
  <text x="166" y="130" text-anchor="middle" font-size="13" fill="#24292f">函数签名</text>
  <text x="166" y="147" text-anchor="middle" font-size="11" fill="#6a737d">inspect.signature</text>
  <rect x="325" y="110" width="200" height="44" rx="6" fill="#ffffff" stroke="#8fb3d9"/>
  <text x="425" y="130" text-anchor="middle" font-size="13" fill="#24292f">JSON Schema</text>
  <text x="425" y="147" text-anchor="middle" font-size="11" fill="#6a737d">注解→类型；docstring→描述</text>
  <rect x="584" y="110" width="220" height="44" rx="6" fill="#ffffff" stroke="#8fb3d9"/>
  <text x="694" y="130" text-anchor="middle" font-size="13" fill="#24292f">呈现给模型的 tools 参数</text>
  <text x="694" y="147" text-anchor="middle" font-size="11" fill="#6a737d">注入参数被剔除（InjectedToolArg）</text>
  <line x1="266" y1="132" x2="320" y2="132" stroke="#5a6b7b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="525" y1="132" x2="579" y2="132" stroke="#5a6b7b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- loop -->
  <rect x="40" y="196" width="790" height="252" rx="10" fill="#eefaf0" stroke="#3d9a50" stroke-width="2"/>
  <text x="66" y="224" font-size="15" font-weight="bold" fill="#2c7a3f">工具调用循环（agent 的心脏）</text>

  <rect x="80" y="244" width="180" height="48" rx="6" fill="#ffffff" stroke="#93c9a0"/>
  <text x="170" y="264" text-anchor="middle" font-size="13" fill="#24292f">① 模型回复</text>
  <text x="170" y="282" text-anchor="middle" font-size="11.5" fill="#6a737d">AIMessage.tool_calls（ai.py:170）</text>

  <rect x="345" y="244" width="180" height="48" rx="6" fill="#ffffff" stroke="#93c9a0"/>
  <text x="435" y="264" text-anchor="middle" font-size="13" fill="#24292f">② 执行工具</text>
  <text x="435" y="282" text-anchor="middle" font-size="11.5" fill="#6a737d">invoke → _parse_input → _run</text>

  <rect x="610" y="244" width="190" height="48" rx="6" fill="#ffffff" stroke="#93c9a0"/>
  <text x="705" y="264" text-anchor="middle" font-size="13" fill="#24292f">③ 回填 ToolMessage</text>
  <text x="705" y="282" text-anchor="middle" font-size="11.5" fill="#6a737d">tool_call_id 配对（tool.py:67）</text>

  <line x1="260" y1="268" x2="340" y2="268" stroke="#5a6b7b" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="525" y1="268" x2="605" y2="268" stroke="#5a6b7b" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M 705 292 C 705 340 170 340 170 297" fill="none" stroke="#8250df" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#arr)"/>
  <text x="437" y="336" text-anchor="middle" font-size="13" fill="#8250df">④ 带着工具结果再问模型（直到回复不含 tool_calls → 最终回答）</text>

  <rect x="66" y="362" width="740" height="72" rx="8" fill="#f6f8fa" stroke="#c9d4de" stroke-dasharray="4 3"/>
  <text x="436" y="386" text-anchor="middle" font-size="12.5" fill="#b35900">边界路径也必须闭合：未知工具 → status="error" 回执；工具抛错 → 包装成 error 回执；return_direct → 结果直接当最终回答</text>
  <text x="436" y="412" text-anchor="middle" font-size="12" fill="#6a737d">永远不存在"模型要了工具却没有配对回执"的悬空状态——这是重放与审计成立的前提</text>
</svg>
