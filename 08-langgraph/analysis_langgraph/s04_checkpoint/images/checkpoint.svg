<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 380" width="870" height="380" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect x="0" y="0" width="870" height="380" fill="#f4f7fa"/>
  <text x="435" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">s04　每拍必存：checkpoint 链 = 可恢复、可回放的底气</text>

  <!-- 左：时间轴 -->
  <rect x="40" y="60" width="440" height="250" rx="10" fill="#ffffff" stroke="#7f9db9" stroke-width="2"/>
  <text x="260" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#34495e">检查点链（thread_id = 存档槽位）</text>
  <line x1="80" y1="290" x2="440" y2="290" stroke="#95a5a6" stroke-width="2" marker-end="url(#ar4)"/>
  <text x="450" y="294" font-size="11" fill="#95a5a6">时间</text>

  <circle cx="110" cy="290" r="6" fill="#85c1e9"/><text x="110" y="268" text-anchor="middle" font-size="11.5" fill="#2471a3">input 档</text>
  <text x="110" y="310" text-anchor="middle" font-size="10.5" fill="#7f8c8d">:1049</text>
  <circle cx="210" cy="290" r="6" fill="#48c9b0"/><text x="210" y="268" text-anchor="middle" font-size="11.5" fill="#148f77">loop 档 #1</text>
  <text x="210" y="310" text-anchor="middle" font-size="10.5" fill="#7f8c8d">:734</text>
  <circle cx="310" cy="290" r="6" fill="#48c9b0"/><text x="310" y="268" text-anchor="middle" font-size="11.5" fill="#148f77">loop 档 #2</text>
  <text x="310" y="310" text-anchor="middle" font-size="10.5" fill="#7f8c8d">:734</text>
  <circle cx="410" cy="290" r="6" fill="#f0b27a"/><text x="410" y="268" text-anchor="middle" font-size="11.5" fill="#af601a">fork 档</text>
  <text x="410" y="310" text-anchor="middle" font-size="10.5" fill="#7f8c8d">:987（s05）</text>

  <text x="260" y="140" text-anchor="middle" font-size="12" fill="#5d6d7e">after_tick 的最后一步：_put_checkpoint({"source": "loop"})</text>
  <text x="260" y="162" text-anchor="middle" font-size="12" fill="#5d6d7e">写入点三类：input / loop / fork —— 每拍一条、id 单调递增</text>
  <text x="260" y="192" text-anchor="middle" font-size="12" fill="#7d6608">id 可排序 → 检查点天然是一条链（parent_config 指向父档）</text>

  <!-- 右：Checkpoint 结构 -->
  <rect x="510" y="60" width="320" height="250" rx="10" fill="#ffffff" stroke="#b3a6dc" stroke-width="2"/>
  <text x="670" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b4a9e">Checkpoint 六字段（base/__init__.py:93）</text>
  <text x="530" y="114" font-size="12" fill="#2c3e50">v　　　　　　　 格式版本（=1）</text>
  <text x="530" y="136" font-size="12" fill="#2c3e50">id　　　　　　　 唯一且单调递增</text>
  <text x="530" y="158" font-size="12" fill="#2c3e50">ts　　　　　　　 ISO 8601 时间戳</text>
  <text x="530" y="180" font-size="12" font-weight="bold" fill="#148f77">channel_values　 状态本体</text>
  <text x="530" y="202" font-size="12" font-weight="bold" fill="#2471a3">channel_versions　通道 → 版本号</text>
  <text x="530" y="224" font-size="12" font-weight="bold" fill="#2471a3">versions_seen　　节点 → 见过的版本</text>
  <text x="530" y="246" font-size="12" fill="#2c3e50">updated_channels　本档新增</text>
  <text x="530" y="278" font-size="11.5" fill="#95a5a6">后三者 = 下一拍规划的全部依据</text>
  <text x="530" y="296" font-size="11.5" fill="#95a5a6">saver 接口：put / get_tuple / list / delete_thread</text>

  <!-- 底部：崩溃恢复 -->
  <rect x="40" y="322" width="790" height="42" rx="8" fill="#fdedec" stroke="#ec7063"/>
  <text x="435" y="340" text-anchor="middle" font-size="12.5" fill="#943126">任一拍崩溃：新进程 get_tuple(thread) → 恢复通道值/版本/versions_seen → 从下一拍继续</text>
  <text x="435" y="357" text-anchor="middle" font-size="11.5" fill="#b03a2e">崩溃只损失"崩溃那一拍"——这就是 durable execution（持久化执行）的字面含义</text>

  <defs>
    <marker id="ar4" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#95a5a6"/>
    </marker>
  </defs>
</svg>
