<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 400" width="870" height="400" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect x="0" y="0" width="870" height="400" fill="#f4f7fa"/>
  <text x="435" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">s06　interrupt：存档挂起，人类输入后节点从头重跑</text>

  <!-- 第一次 invoke -->
  <rect x="40" y="58" width="380" height="180" rx="10" fill="#ffffff" stroke="#5d8aa8" stroke-width="2"/>
  <text x="60" y="84" font-size="13.5" font-weight="bold" fill="#2c5f8a">第一次 invoke（跑到提问就挂起）</text>
  <rect x="60" y="98" width="340" height="30" rx="6" fill="#eaf2f8" stroke="#85c1e9"/>
  <text x="230" y="119" text-anchor="middle" font-size="12" fill="#2471a3">approval_node：[副作用] → interrupt("批准?")</text>
  <rect x="60" y="136" width="340" height="30" rx="6" fill="#fdedec" stroke="#ec7063"/>
  <text x="230" y="157" text-anchor="middle" font-size="12" fill="#943126">抛 GraphInterrupt → 检查点照存（含 INTERRUPT 信号）</text>
  <text x="230" y="192" text-anchor="middle" font-size="11.5" fill="#7b5232">进程可以退出、机器可以关机</text>
  <text x="230" y="212" text-anchor="middle" font-size="11" fill="#95a5a6">副作用执行第 1 次</text>

  <!-- 人类时间 -->
  <rect x="440" y="98" width="90" height="68" rx="8" fill="#fef9e7" stroke="#f1c40f"/>
  <text x="485" y="126" text-anchor="middle" font-size="12" fill="#7d6608">人类审阅</text>
  <text x="485" y="146" text-anchor="middle" font-size="11" fill="#7d6608">几小时也行</text>
  <line x1="420" y1="132" x2="440" y2="132" stroke="#7d6608" stroke-width="2" marker-end="url(#ar6)"/>
  <line x1="530" y1="132" x2="555" y2="132" stroke="#7d6608" stroke-width="2" marker-end="url(#ar6)"/>
  <text x="545" y="118" font-size="11.5" fill="#7d6608">Command(resume="批准")</text>

  <!-- 第二次 invoke -->
  <rect x="450" y="180" width="380" height="180" rx="10" fill="#ffffff" stroke="#48c9b0" stroke-width="2"/>
  <text x="470" y="206" font-size="13.5" font-weight="bold" fill="#148f77">第二次 invoke（节点从头重跑）</text>
  <rect x="470" y="220" width="340" height="30" rx="6" fill="#eaf7ee" stroke="#7dcea0"/>
  <text x="640" y="241" text-anchor="middle" font-size="12" fill="#1e8449">approval_node 重跑：[副作用] → interrupt() 返回"批准"</text>
  <rect x="470" y="258" width="340" height="30" rx="6" fill="#eaf7ee" stroke="#7dcea0"/>
  <text x="640" y="279" text-anchor="middle" font-size="12" fill="#1e8449">deploy_node：正常执行</text>
  <text x="640" y="314" text-anchor="middle" font-size="11.5" fill="#7b5232">副作用执行第 2 次 —— interrupt 前的副作用必须幂等！</text>
  <text x="640" y="334" text-anchor="middle" font-size="11" fill="#95a5a6">types.py:902 "re-executing all logic"</text>

  <!-- 底部三条语义 -->
  <rect x="40" y="286" width="380" height="94" rx="8" fill="#f5eef8" stroke="#b3a6dc"/>
  <text x="60" y="310" font-size="12" fill="#5b4a9e">三条语义（types.py:887-913 docstring）：</text>
  <text x="60" y="330" font-size="11.5" fill="#5b4a9e">① 首次调用抛 GraphInterrupt 挂起整图</text>
  <text x="60" y="348" font-size="11.5" fill="#5b4a9e">② 恢复 = Command(resume=...)，节点从头重跑</text>
  <text x="60" y="366" font-size="11.5" fill="#5b4a9e">③ 多 interrupt 按出现顺序配对；④ 必须配 checkpointer</text>

  <defs>
    <marker id="ar6" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7d6608"/>
    </marker>
  </defs>
</svg>
