<svg xmlns="http://www.w3.org/2000/svg" width="870" height="470" viewBox="0 0 870 470" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6b7b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="870" height="470" fill="#fafbfc"/>
  <text x="435" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#24292f">runLoop 与 processor：两级收束协议（"compact" | "stop" | "continue"）</text>

  <!-- runLoop box -->
  <rect x="40" y="60" width="430" height="380" rx="10" fill="#eef4fb" stroke="#4a78b5" stroke-width="2"/>
  <text x="255" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b5985">runLoop（session/prompt.ts，while(true)）</text>

  <rect x="65" y="104" width="380" height="46" rx="6" fill="#ffffff" stroke="#8fb3d9"/>
  <text x="255" y="123" text-anchor="middle" font-size="12.5" fill="#24292f">① 重读投影：filterCompacted + latest()</text>
  <text x="255" y="141" text-anchor="middle" font-size="11" fill="#6a737d">每轮从消息日志重来，不拿旧数组</text>

  <rect x="65" y="160" width="380" height="58" rx="6" fill="#fff7e6" stroke="#d9a03c"/>
  <text x="255" y="180" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a5a00">② 停环四条件（:1106-1130）</text>
  <text x="255" y="198" text-anchor="middle" font-size="11.5" fill="#24292f">finish 可信 ∧ 非 tool-calls/unknown</text>
  <text x="255" y="213" text-anchor="middle" font-size="11.5" fill="#b35900">∧ 无未结算 tool call ∧ parentID === lastUser.id</text>

  <rect x="65" y="228" width="380" height="46" rx="6" fill="#ffffff" stroke="#8fb3d9"/>
  <text x="255" y="247" text-anchor="middle" font-size="12.5" fill="#24292f">③ 任务队列：subtask → 子代理；compaction → 压缩</text>
  <text x="255" y="265" text-anchor="middle" font-size="11" fill="#6a737d">溢出只打标记，continue 后下一轮才入队压缩</text>

  <rect x="65" y="284" width="380" height="46" rx="6" fill="#ffffff" stroke="#8fb3d9"/>
  <text x="255" y="303" text-anchor="middle" font-size="12.5" fill="#24292f">④ 拼系统提示 + 工具集 → handle.process(...)</text>
  <text x="255" y="321" text-anchor="middle" font-size="11" fill="#6a737d">maxSteps 默认 ∞，末轮追加 MAX_STEPS_PROMPT</text>

  <rect x="65" y="340" width="380" height="44" rx="6" fill="#f0f7ee" stroke="#3d9a50"/>
  <text x="255" y="359" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c7a3f">⑤ 按三态决定去留（:1319-1329）</text>
  <text x="255" y="376" text-anchor="middle" font-size="11.5" fill="#24292f">stop → break　compact → 建压缩任务　否则 continue</text>

  <path d="M 455 118 H 520" stroke="#5a6b7b" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 520 362 H 455" stroke="#5a6b7b" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- processor box -->
  <rect x="520" y="60" width="310" height="380" rx="10" fill="#eefaf0" stroke="#3d9a50" stroke-width="2"/>
  <text x="675" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c7a3f">processor（session/processor.ts）</text>
  <rect x="545" y="104" width="260" height="46" rx="6" fill="#ffffff" stroke="#93c9a0"/>
  <text x="675" y="123" text-anchor="middle" font-size="12.5" fill="#24292f">消费 LLMEvent 流（llm.stream）</text>
  <text x="675" y="141" text-anchor="middle" font-size="11" fill="#6a737d">逐事件落库 + 重试 + 中断清理</text>
  <rect x="545" y="160" width="260" height="64" rx="6" fill="#ffffff" stroke="#93c9a0"/>
  <text x="675" y="180" text-anchor="middle" font-size="12.5" fill="#24292f">tool-call → 挂起；tool-result → 结算</text>
  <text x="675" y="198" text-anchor="middle" font-size="12.5" fill="#24292f">step-finish → 算 usage / 判溢出</text>
  <text x="675" y="216" text-anchor="middle" font-size="11" fill="#6a737d">tokens ≥ usable 即 needsCompaction</text>
  <rect x="545" y="234" width="260" height="120" rx="6" fill="#fdf3f3" stroke="#c98a8a"/>
  <text x="675" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3030">返回三态（:30 / :693-695）</text>
  <text x="675" y="280" text-anchor="middle" font-size="12.5" fill="#24292f">"continue" —— 还有 tool call 欠账</text>
  <text x="675" y="304" text-anchor="middle" font-size="12.5" fill="#24292f">"compact" —— 上下文溢出</text>
  <text x="675" y="328" text-anchor="middle" font-size="12.5" fill="#24292f">"stop" —— 仅 blocked（权限被拒）/ error</text>
  <text x="675" y="348" text-anchor="middle" font-size="10.5" fill="#8a3030">健康完成（哪怕 finish=stop）也返回 continue</text>
  <rect x="545" y="364" width="260" height="60" rx="6" fill="#f6f8fa" stroke="#c9d4de" stroke-dasharray="4 3"/>
  <text x="675" y="384" text-anchor="middle" font-size="11.5" fill="#24292f">overflow.ts：usable = limit − min(20000, maxOut)</text>
  <text x="675" y="402" text-anchor="middle" font-size="11.5" fill="#24292f">count ≥ usable 即溢出（注意是 ≥）</text>
  <text x="675" y="419" text-anchor="middle" font-size="10.5" fill="#6a737d">limit=0 视为"未知模型"，宁可不压也不误伤</text>

  <text x="435" y="458" text-anchor="middle" font-size="12" fill="#6a737d">关键认识：停环不靠步数计数，靠"finish 可信 ∧ 本地无欠账"的收束协议</text>
</svg>
