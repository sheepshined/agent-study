<svg xmlns="http://www.w3.org/2000/svg" width="870" height="460" viewBox="0 0 870 460" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6b7b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="870" height="460" fill="#fafbfc"/>
  <text x="435" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#24292f">task：深度检查 → 权限确认 → deny 继承 → 建子会话 → 递归同一 runLoop</text>

  <!-- parent session -->
  <rect x="40" y="62" width="360" height="250" rx="10" fill="#eef4fb" stroke="#4a78b5" stroke-width="2"/>
  <text x="220" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b5985">父会话 session#1（agent=build，depth=0）</text>
  <rect x="60" y="102" width="320" height="40" rx="6" fill="#ffffff" stroke="#8fb3d9"/>
  <text x="220" y="122" text-anchor="middle" font-size="11.5" fill="#24292f">runLoop 循环顶四条件（s01）</text>
  <text x="220" y="136" text-anchor="middle" font-size="10" fill="#6a737d">同一段代码，父子共用</text>
  <rect x="60" y="150" width="320" height="42" rx="6" fill="#fdf3e7" stroke="#d9a03c"/>
  <text x="220" y="168" text-anchor="middle" font-size="11.5" fill="#24292f">模型发起 task(subagent_type:"explore")</text>
  <text x="220" y="185" text-anchor="middle" font-size="10" fill="#6a737d">①深度上溯计数 ②ask 权限确认（task.ts:106-129）</text>
  <rect x="60" y="200" width="320" height="52" rx="6" fill="#fdf3f3" stroke="#c98a8a"/>
  <text x="220" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3030">③ 权限继承（subagent-permissions.ts:10-27）</text>
  <text x="220" y="238" text-anchor="middle" font-size="10.5" fill="#24292f">只拿父的 deny + external_directory；allow/ask 不下传</text>
  <text x="220" y="272" text-anchor="middle" font-size="10.5" fill="#6a737d">另自动 deny：todowrite / task（子不记账、不再委派）</text>

  <!-- arrow -->
  <path d="M 400 226 H 455" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="428" y="216" text-anchor="middle" font-size="11" fill="#24292f">④建子会话</text>
  <text x="428" y="248" text-anchor="middle" font-size="11" fill="#24292f">⑤递归</text>

  <!-- child session -->
  <rect x="458" y="62" width="372" height="250" rx="10" fill="#eefaf0" stroke="#3d9a50" stroke-width="2"/>
  <text x="644" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c7a3f">子会话 session#2（agent=explore，depth=1）</text>
  <rect x="478" y="102" width="332" height="40" rx="6" fill="#ffffff" stroke="#93c9a0"/>
  <text x="644" y="122" text-anchor="middle" font-size="11.5" fill="#24292f">同一个 runLoop（task.ts:200-225 经 promptOps.prompt）</text>
  <text x="644" y="136" text-anchor="middle" font-size="10" fill="#6a737d">共享同一套工具 / provider / 权限内核</text>
  <rect x="478" y="150" width="332" height="42" rx="6" fill="#ffffff" stroke="#93c9a0"/>
  <text x="644" y="168" text-anchor="middle" font-size="11.5" fill="#24292f">子会话的 20 轮工具调用留在子会话日志</text>
  <text x="644" y="185" text-anchor="middle" font-size="10" fill="#6a737d">父上下文不进来 —— 过程不可见</text>
  <rect x="478" y="200" width="332" height="52" rx="6" fill="#fdf3e7" stroke="#d9a03c"/>
  <text x="644" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a5a00">结果：&lt;task id=… state=completed&gt;&lt;summary&gt;</text>
  <text x="644" y="238" text-anchor="middle" font-size="10.5" fill="#24292f">取子会话最后一段 text（:64-79）—— 结论可见</text>
  <text x="644" y="272" text-anchor="middle" font-size="10.5" fill="#6a737d">后台子代理则以 synthetic user 消息注回父会话</text>

  <!-- depth strip -->
  <rect x="40" y="326" width="790" height="40" rx="8" fill="#f6f8fa" stroke="#c9d4de"/>
  <text x="435" y="344" text-anchor="middle" font-size="12" fill="#24292f">深度链：session#1 (depth 0) ──task──▶ session#2 (depth 1) ──task──▶ …</text>
  <text x="435" y="360" text-anchor="middle" font-size="11" fill="#8a3030">subagent_depth 默认 1；到顶返回 "Subagent depth limit reached (1)" 回灌模型</text>

  <!-- delegation surface -->
  <rect x="40" y="380" width="790" height="56" rx="8" fill="#eef4fb" stroke="#8fb3d9"/>
  <text x="435" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5985">委派面（registry.ts:265-278）：模型在 task 工具描述里只看见 mode=subagent 且未被 deny 的</text>
  <text x="435" y="424" text-anchor="middle" font-size="11.5" fill="#24292f">general、explore 入列；build/plan 是 primary，compaction/title/summary 是 hidden —— 永不进委派面</text>
</svg>
