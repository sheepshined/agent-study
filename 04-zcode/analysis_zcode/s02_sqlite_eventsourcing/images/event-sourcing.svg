<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6b7b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="400" fill="#fafbfc"/>
  <text x="440" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#24292f">SQLite 事件溯源：事件即事实，fork / rewind 都是投影</text>

  <!-- event log -->
  <rect x="40" y="60" width="360" height="290" rx="10" fill="#eef4fb" stroke="#4a78b5" stroke-width="2"/>
  <text x="220" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b5985">事件表（唯一真源，只追加）</text>
  <g font-size="11.5" font-family="Consolas, monospace" fill="#24292f">
    <text x="60" y="116">#01 session/created</text>
    <text x="60" y="140">#02 user/message</text>
    <text x="60" y="164">#03 model/request</text>
    <text x="60" y="188">#04 tool/result</text>
    <rect x="55" y="198" width="330" height="22" fill="#f3eefe" opacity="0.9"/>
    <text x="60" y="213" fill="#6639ba">#05 rewind/triggered（负向事实：回卷到 #02）</text>
    <text x="60" y="240">#06 user/message（重试后的新输入）</text>
    <text x="60" y="264">#07 model/complete</text>
    <text x="60" y="292" fill="#8250df">…usage/结算 · permission/规则 · checkpoint…</text>
  </g>
  <text x="220" y="330" text-anchor="middle" font-size="11.5" fill="#b35900">没有一条 UPDATE：回卷本身也是一条新事实</text>

  <!-- fork tree -->
  <rect x="470" y="60" width="190" height="130" rx="10" fill="#fdf6ec" stroke="#c98a2b" stroke-width="2"/>
  <text x="565" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5a12">fork = INSERT</text>
  <g font-size="11.5" font-family="Consolas, monospace" fill="#24292f">
    <text x="490" y="112">sessionA (main)</text>
    <text x="490" y="134">└─ sessionB</text>
    <text x="510" y="156">parent_id → A</text>
  </g>
  <text x="565" y="178" text-anchor="middle" font-size="11" fill="#8a5a12">重放 0..#04 作为初始投影，不复制历史</text>

  <!-- projection -->
  <rect x="670" y="60" width="170" height="130" rx="10" fill="#eefaf0" stroke="#3d9a50" stroke-width="2"/>
  <text x="755" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c7a3f">投影（可重放）</text>
  <text x="755" y="112" text-anchor="middle" font-size="11.5" fill="#24292f">project(0..seq) 折叠出</text>
  <text x="755" y="134" text-anchor="middle" font-size="11.5" fill="#24292f">消息 / todo / usage / 权限</text>
  <text x="755" y="162" text-anchor="middle" font-size="11" fill="#2c7a3f">同一日志 → 同一状态</text>

  <!-- recovery -->
  <rect x="470" y="220" width="370" height="130" rx="10" fill="#fff3f3" stroke="#c9524a" stroke-width="2"/>
  <text x="655" y="246" text-anchor="middle" font-size="14" font-weight="bold" fill="#a83a32">冷恢复（断电重启）</text>
  <text x="655" y="272" text-anchor="middle" font-size="11.5" fill="#24292f">resumeFromStore：只看事件表重放</text>
  <text x="655" y="294" text-anchor="middle" font-size="11.5" fill="#24292f">不依赖内存状态；骨架/半步由 hydrator 收敛</text>
  <text x="655" y="322" text-anchor="middle" font-size="11" fill="#a83a32">真实代码：methods/resume.ts:59 + agent/session-history-hydrator.ts</text>

  <line x1="400" y1="120" x2="464" y2="115" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="660" y1="115" x2="664" y2="115" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="400" y1="260" x2="464" y2="275" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arr)"/>

  <text x="440" y="380" text-anchor="middle" font-size="13" fill="#6a737d">对应真实源码：adapters/src/storage/session-store/migrations.ts（0001→0022，session.parent_id 分叉树）｜session-fork.ts:851,895,1050</text>
</svg>
