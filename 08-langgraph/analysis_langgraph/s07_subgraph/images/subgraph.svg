<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 400" width="870" height="400" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect x="0" y="0" width="870" height="400" fill="#f4f7fa"/>
  <text x="435" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">s07　subgraph：图中有图，状态隔离 + 命名空间嵌套</text>

  <!-- 父图 -->
  <rect x="40" y="60" width="790" height="200" rx="10" fill="#ffffff" stroke="#7f9db9" stroke-width="2"/>
  <text x="60" y="86" font-size="14" font-weight="bold" fill="#34495e">父图（自己的 BSP 循环，检查点存 ns=""）</text>

  <rect x="70" y="104" width="150" height="60" rx="8" fill="#eaf2f8" stroke="#85c1e9"/>
  <text x="145" y="130" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2471a3">supervisor</text>
  <text x="145" y="150" text-anchor="middle" font-size="11" fill="#5d6d7e">超步1：派活 task</text>

  <line x1="220" y1="134" x2="280" y2="134" stroke="#2c3e50" stroke-width="2" marker-end="url(#ar7)"/>
  <text x="250" y="120" text-anchor="middle" font-size="10.5" fill="#7f8c8d">task ↓</text>

  <rect x="285" y="96" width="280" height="150" rx="8" fill="#fef5e7" stroke="#f0b27a" stroke-width="2"/>
  <text x="425" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#af601a">子图 worker（父图眼里 = 1 个任务）</text>
  <rect x="305" y="134" width="110" height="40" rx="6" fill="#ffffff" stroke="#e59866"/>
  <text x="360" y="158" text-anchor="middle" font-size="11.5" fill="#9c4221">research（子超步1）</text>
  <rect x="430" y="134" width="110" height="40" rx="6" fill="#ffffff" stroke="#e59866"/>
  <text x="485" y="158" text-anchor="middle" font-size="11.5" fill="#9c4221">draft（子超步2）</text>
  <text x="425" y="196" text-anchor="middle" font-size="10.5" fill="#7b5232">私有键 findings/notes 留在子图命名空间</text>
  <text x="425" y="214" text-anchor="middle" font-size="10.5" fill="#7b5232">子超步 N 拍在父图里只算 1 拍的一个任务</text>
  <text x="425" y="232" text-anchor="middle" font-size="10.5" fill="#7b5232">检查点存 ns="父:worker|task-id"（_algo.py:626）</text>

  <line x1="565" y1="134" x2="625" y2="134" stroke="#2c3e50" stroke-width="2" marker-end="url(#ar7)"/>
  <text x="595" y="120" text-anchor="middle" font-size="10.5" fill="#7f8c8d">report ↑</text>

  <rect x="630" y="104" width="170" height="60" rx="8" fill="#eaf7ee" stroke="#7dcea0"/>
  <text x="715" y="130" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e8449">reviewer</text>
  <text x="715" y="150" text-anchor="middle" font-size="11" fill="#5d6d7e">超步2/3：只看得到 report</text>

  <!-- 底部：三条语义 -->
  <rect x="40" y="280" width="250" height="96" rx="8" fill="#f5eef8" stroke="#b3a6dc"/>
  <text x="60" y="304" font-size="12" font-weight="bold" fill="#5b4a9e">① 状态隔离</text>
  <text x="60" y="324" font-size="11" fill="#5b4a9e">子图有自己的 schema；</text>
  <text x="60" y="342" font-size="11" fill="#5b4a9e">同名键 = 透传面，私有键过不了界</text>
  <text x="60" y="362" font-size="11" fill="#95a5a6">graph/state.py:1214（可继承 checkpointer）</text>

  <rect x="310" y="280" width="250" height="96" rx="8" fill="#fef9e7" stroke="#f1c40f"/>
  <text x="330" y="304" font-size="12" font-weight="bold" fill="#7d6608">② 命名空间嵌套</text>
  <text x="330" y="324" font-size="11" fill="#7d6608">父:节点名|task_id（NS_SEP/NS_END）</text>
  <text x="330" y="342" font-size="11" fill="#7d6608">每台子图有自己完整的检查点链</text>
  <text x="330" y="362" font-size="11" fill="#95a5a6">pregel/_algo.py:626（实测）</text>

  <rect x="580" y="280" width="250" height="96" rx="8" fill="#fdedec" stroke="#ec7063"/>
  <text x="600" y="304" font-size="12" font-weight="bold" fill="#943126">③ 失败边界</text>
  <text x="600" y="324" font-size="11" fill="#943126">子图超限/抛错 = 父图一个任务失败，</text>
  <text x="600" y="342" font-size="11" fill="#943126">未经 error handler 就上抛给调用方</text>
  <text x="600" y="362" font-size="11" fill="#95a5a6">拓扑同样受版本差分规则约束</text>

  <defs>
    <marker id="ar7" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>
