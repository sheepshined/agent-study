<svg xmlns="http://www.w3.org/2000/svg" width="870" height="460" viewBox="0 0 870 460" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6b7b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="870" height="460" fill="#fafbfc"/>
  <text x="435" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#24292f">LCEL：a | b 的脱糖——运算符重载 + 归一化 + 串行管道</text>

  <!-- expression row -->
  <rect x="60" y="70" width="750" height="86" rx="10" fill="#eef4fb" stroke="#4a78b5" stroke-width="2"/>
  <text x="90" y="105" font-size="15" font-weight="bold" fill="#2b5985">书写视角</text>
  <text x="435" y="110" text-anchor="middle" font-size="17" fill="#24292f">prompt  |  model  |  parser</text>
  <text x="435" y="138" text-anchor="middle" font-size="12.5" fill="#6a737d">三次 __or__（base.py:640），右侧经 coerce_to_runnable（:6640）归一化，全部装进 RunnableSequence</text>

  <!-- coercion layer -->
  <rect x="60" y="180" width="750" height="96" rx="10" fill="#fff8e6" stroke="#bd8a00" stroke-width="2"/>
  <text x="90" y="208" font-size="15" font-weight="bold" fill="#8a6500">规整层 coerce_to_runnable（真相视角：全变成 Runnable）</text>
  <rect x="90" y="222" width="210" height="40" rx="6" fill="#ffffff" stroke="#e0c078"/>
  <text x="195" y="247" text-anchor="middle" font-size="13" fill="#24292f">Runnable → 原样进入</text>
  <rect x="320" y="222" width="210" height="40" rx="6" fill="#ffffff" stroke="#e0c078"/>
  <text x="425" y="247" text-anchor="middle" font-size="13" fill="#24292f">函数 → RunnableLambda</text>
  <rect x="550" y="222" width="230" height="40" rx="6" fill="#ffffff" stroke="#e0c078"/>
  <text x="665" y="247" text-anchor="middle" font-size="13" fill="#24292f">字典 → RunnableParallel</text>

  <!-- sequence -->
  <rect x="60" y="300" width="750" height="130" rx="10" fill="#eefaf0" stroke="#3d9a50" stroke-width="2"/>
  <text x="90" y="328" font-size="15" font-weight="bold" fill="#2c7a3f">RunnableSequence（base.py:3092）</text>
  <rect x="105" y="345" width="170" height="42" rx="6" fill="#ffffff" stroke="#93c9a0"/>
  <text x="190" y="371" text-anchor="middle" font-size="13" fill="#24292f">step 0：prompt</text>
  <rect x="345" y="345" width="170" height="42" rx="6" fill="#ffffff" stroke="#93c9a0"/>
  <text x="430" y="371" text-anchor="middle" font-size="13" fill="#24292f">step 1：model</text>
  <rect x="585" y="345" width="170" height="42" rx="6" fill="#ffffff" stroke="#93c9a0"/>
  <text x="670" y="371" text-anchor="middle" font-size="13" fill="#24292f">step 2：parser</text>
  <line x1="275" y1="366" x2="340" y2="366" stroke="#5a6b7b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="515" y1="366" x2="580" y2="366" stroke="#5a6b7b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="435" y="415" text-anchor="middle" font-size="12.5" fill="#24292f">invoke：for 循环逐步传值；每步前 patch_config 挂子回调（:3465）——回调树逐层生长</text>
  <text x="435" y="438" text-anchor="middle" font-size="12.5" fill="#b35900">拍平（:3208-3212）：(a|b)|c 与 a|(b|c) 的 steps 都是 [a,b,c] —— 链不会越拼越深</text>
</svg>
