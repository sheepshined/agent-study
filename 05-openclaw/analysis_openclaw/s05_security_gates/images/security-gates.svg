<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6b7b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="460" fill="#fafbfc"/>
  <text x="440" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#24292f">s05 安全三道闸：Identity first → Scope next → Model last</text>

  <!-- gate 1: dm pairing -->
  <rect x="28" y="70" width="250" height="220" rx="10" fill="#eef4fb" stroke="#4a78b5" stroke-width="2"/>
  <text x="153" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b5985">第一道闸：dmPolicy（谁能私聊）</text>
  <g font-size="11.5" fill="#24292f">
    <text x="44" y="126">pairing（默认）/ allowlist / open / disabled</text>
    <text x="44" y="152">未知发送者 → 回配对码，消息本身忽略</text>
    <text x="44" y="176">码 1 小时过期 · 每渠道 ≤3 条待批</text>
    <text x="44" y="202">批准：openclaw pairing approve</text>
    <text x="44" y="230" font-family="Consolas, monospace">allowFrom 落盘：共享 SQLite</text>
    <text x="44" y="256" fill="#b35900">文档四页仍写 JSON——以源码为准</text>
  </g>

  <!-- gate 2: group allowlist -->
  <rect x="315" y="70" width="250" height="220" rx="10" fill="#eefaf0" stroke="#3d9a50" stroke-width="2"/>
  <text x="440" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c7a3f">第二道闸：两层白名单</text>
  <g font-size="11.5" fill="#24292f">
    <text x="331" y="126">DM 层：allowFrom</text>
    <text x="331" y="150">群层：groups/guilds/channels</text>
    <text x="331" y="172">　　　+ groupAllowFrom</text>
    <text x="331" y="198">检查顺序：groupPolicy → 激活方式</text>
    <text x="331" y="224" fill="#b42318">回复机器人（隐式提及）</text>
    <text x="331" y="244" fill="#b42318">不绕过 groupAllowFrom</text>
    <text x="331" y="272" fill="#6639ba">contextVisibility：能触发 ≠ 能进模型</text>
  </g>
  <line x1="278" y1="180" x2="309" y2="180" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- gate 3: exec approvals -->
  <rect x="602" y="70" width="250" height="220" rx="10" fill="#f3eefe" stroke="#8250df" stroke-width="2"/>
  <text x="727" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#6639ba">第三道闸：exec 审批绑定</text>
  <g font-size="11.5" fill="#24292f">
    <text x="618" y="126">policy + allowlist + 用户批准</text>
    <text x="618" y="148">三者同时同意，严格度取更严者</text>
    <text x="618" y="178">批准绑定四件事：</text>
    <text x="634" y="198">cwd · 精确 argv · env 绑定</text>
    <text x="634" y="218">解析后真实路径（+内容哈希）</text>
    <text x="618" y="244" fill="#b42318">等待期 PATH 漂移 → 拒绝</text>
    <text x="618" y="266" fill="#b42318">认不出唯一文件操作数 → 拒签</text>
  </g>
  <line x1="565" y1="180" x2="596" y2="180" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- bottom invariant -->
  <rect x="28" y="330" width="824" height="76" rx="10" fill="#fff3f3" stroke="#d29922" stroke-width="1.5"/>
  <text x="440" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5a12">为什么闸门都在"变 run 之前 / 执行之前"：无人值守系统没有人在旁边说"不"</text>
  <text x="440" y="384" text-anchor="middle" font-size="12" fill="#6a737d">模型 last：假设模型可被操纵，操纵的爆炸半径由前面的闸门圈定（trust-model.md:76-80）｜ 误批一个陌生 DM ≈ 交出整台机器的 shell 面</text>

  <text x="440" y="436" text-anchor="middle" font-size="12" fill="#6a737d">对应真实源码：src/pairing/pairing-store.ts:285/:420 ｜ src/channels/mention-gating.ts:157 ｜ src/agents/bash-tools.exec-approval-request.ts:373 ｜ docs/tools/exec-approvals.md:56-59</text>
</svg>
