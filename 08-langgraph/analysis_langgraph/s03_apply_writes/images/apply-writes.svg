<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 380" width="870" height="380" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect x="0" y="0" width="870" height="380" fill="#f4f7fa"/>
  <text x="435" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">s03　apply_writes：一拍写入的五段式流水（_algo.py:244）</text>

  <!-- 左：同一拍的写入 -->
  <rect x="40" y="64" width="240" height="150" rx="10" fill="#ffffff" stroke="#7f9db9" stroke-width="2"/>
  <text x="160" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#34495e">同一拍的写入（乱序完成）</text>
  <rect x="60" y="104" width="200" height="26" rx="6" fill="#eaf2f8" stroke="#85c1e9"/>
  <text x="160" y="122" text-anchor="middle" font-size="12" fill="#2471a3">gamma → ("plan", "γ")</text>
  <rect x="60" y="138" width="200" height="26" rx="6" fill="#eaf2f8" stroke="#85c1e9"/>
  <text x="160" y="156" text-anchor="middle" font-size="12" fill="#2471a3">alpha → ("plan", "α")</text>
  <rect x="60" y="172" width="200" height="26" rx="6" fill="#eaf2f8" stroke="#85c1e9"/>
  <text x="160" y="190" text-anchor="middle" font-size="12" fill="#2471a3">beta → ("plan", "β")</text>

  <!-- 中：五段流水 -->
  <line x1="280" y1="139" x2="330" y2="139" stroke="#2c3e50" stroke-width="2" marker-end="url(#ar3)"/>
  <rect x="335" y="56" width="270" height="240" rx="10" fill="#ffffff" stroke="#b3a6dc" stroke-width="2"/>
  <text x="470" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b4a9e">apply_writes 五段（行号实测）</text>
  <text x="352" y="106" font-size="12" fill="#2c3e50">① 确定性排序 sorted(task_path)　:268</text>
  <text x="352" y="130" font-size="12" fill="#2c3e50">② versions_seen 落账（先于写入！）　:275</text>
  <text x="352" y="154" font-size="12" fill="#2c3e50">③ 消费被读通道 consume()　:301-303</text>
  <text x="352" y="178" font-size="12" fill="#2c3e50">④ 按通道分组 → update(vals)　:315-335</text>
  <text x="352" y="202" font-size="12" fill="#2c3e50">⑤ bump_step 空写入未更新通道　:339-345</text>
  <text x="352" y="226" font-size="12" fill="#2c3e50">　 finish 终局通知　:348-354</text>
  <text x="352" y="262" font-size="11.5" fill="#95a5a6">reducer 在第 ④ 段的 update 里执行</text>
  <text x="352" y="280" font-size="11.5" fill="#95a5a6">（_algo.py:331 调到 binop.py:143）</text>

  <!-- 右：两种结局 -->
  <line x1="605" y1="139" x2="655" y2="100" stroke="#2c3e50" stroke-width="2" marker-end="url(#ar3)"/>
  <line x1="605" y1="139" x2="655" y2="200" stroke="#2c3e50" stroke-width="2" marker-end="url(#ar3)"/>

  <rect x="660" y="72" width="170" height="66" rx="8" fill="#e8f8f5" stroke="#48c9b0"/>
  <text x="745" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#148f77">键有 reducer</text>
  <text x="745" y="116" text-anchor="middle" font-size="11" fill="#0e6655">N 个值折叠 N 次</text>
  <text x="745" y="130" text-anchor="middle" font-size="10.5" fill="#0e6655">结果: α|β|γ（路径序）</text>

  <rect x="660" y="168" width="170" height="66" rx="8" fill="#fdedec" stroke="#ec7063"/>
  <text x="745" y="192" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#943126">键无 reducer</text>
  <text x="745" y="212" text-anchor="middle" font-size="11" fill="#79241c">LastValue 一拍一值</text>
  <text x="745" y="226" text-anchor="middle" font-size="10.5" fill="#79241c">双写 → InvalidUpdateError</text>

  <!-- 底部结论 -->
  <rect x="40" y="316" width="790" height="44" rx="8" fill="#fef9e7" stroke="#f1c40f"/>
  <text x="435" y="335" text-anchor="middle" font-size="13" fill="#7d6608">引擎从不裁决"听谁的"——它只按通道分组交出去，裁决权全在键的声明里</text>
  <text x="435" y="353" text-anchor="middle" font-size="11.5" fill="#a1862b">bump_step 顺带清空 EphemeralValue：输入通道用完即走，图不会永动</text>

  <defs>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>
