<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 330" width="870" height="330" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect x="0" y="0" width="870" height="330" fill="#f4f7fa"/>

  <text x="435" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">s01　schema → 通道：合并语义在建图期就定了</text>

  <!-- 左：State schema -->
  <rect x="40" y="70" width="330" height="180" rx="10" fill="#ffffff" stroke="#7f9db9" stroke-width="2"/>
  <text x="205" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#34495e">State（TypedDict 声明）</text>
  <text x="60" y="126" font-size="13" fill="#5d6d7e">count: int</text>
  <rect x="228" y="112" width="96" height="20" rx="9" fill="#eaf2f8" stroke="#85c1e9"/><text x="276" y="126" text-anchor="middle" font-size="11" fill="#2471a3">无 reducer</text>
  <text x="60" y="158" font-size="13" fill="#5d6d7e">logs: list</text>
  <rect x="228" y="144" width="96" height="20" rx="9" fill="#eaf2f8" stroke="#85c1e9"/><text x="276" y="158" text-anchor="middle" font-size="11" fill="#2471a3">无 reducer</text>
  <text x="60" y="190" font-size="13" fill="#5d6d7e">msgs: Annotated[list,</text>
  <text x="60" y="210" font-size="13" fill="#5d6d7e">　　　　　add_messages]</text>
  <rect x="216" y="180" width="108" height="20" rx="9" fill="#e8f8f5" stroke="#48c9b0"/><text x="270" y="194" text-anchor="middle" font-size="11" fill="#148f77">reducer 挂载</text>
  <text x="60" y="238" font-size="12" fill="#95a5a6">节点签名：State → Partial&lt;State&gt;</text>

  <!-- 中：compile 箭头 -->
  <line x1="380" y1="160" x2="470" y2="160" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="425" y="146" text-anchor="middle" font-size="12" fill="#2c3e50">compile</text>
  <text x="425" y="182" text-anchor="middle" font-size="11" fill="#7f8c8d">提取 Annotated</text>
  <text x="425" y="198" text-anchor="middle" font-size="11" fill="#7f8c8d">校验 (a,b)→c</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2c3e50"/>
    </marker>
  </defs>

  <!-- 右：channels -->
  <rect x="480" y="70" width="350" height="180" rx="10" fill="#ffffff" stroke="#7f9db9" stroke-width="2"/>
  <text x="655" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#34495e">channels/（运行时载体）</text>

  <rect x="500" y="112" width="150" height="26" rx="6" fill="#fdf2e9" stroke="#e59866"/>
  <text x="575" y="130" text-anchor="middle" font-size="12" fill="#9c4221">count → LastValue</text>
  <rect x="660" y="112" width="152" height="26" rx="6" fill="#fdf2e9" stroke="#e59866"/>
  <text x="736" y="130" text-anchor="middle" font-size="12" fill="#9c4221">logs → LastValue</text>

  <rect x="500" y="150" width="312" height="44" rx="6" fill="#e8f8f5" stroke="#48c9b0"/>
  <text x="656" y="168" text-anchor="middle" font-size="12" fill="#148f77">msgs → BinaryOperatorAggregate</text>
  <text x="656" y="186" text-anchor="middle" font-size="11" fill="#148f77">reducer=add_messages（逐值折叠）</text>

  <text x="500" y="222" font-size="11.5" fill="#95a5a6">LastValue：一拍只收一个值，多了就 InvalidUpdateError</text>
  <text x="500" y="240" font-size="11.5" fill="#95a5a6">reducer 通道：一拍收 N 个值就折叠 N 次</text>

  <!-- 底部：两条纪律 -->
  <rect x="40" y="268" width="790" height="44" rx="8" fill="#fef9e7" stroke="#f1c40f"/>
  <text x="435" y="287" text-anchor="middle" font-size="13" fill="#7d6608">纪律一：节点只交增量补丁，不碰全量状态　　纪律二：同拍多写同一键，必须走 reducer</text>
  <text x="435" y="305" text-anchor="middle" font-size="11.5" fill="#a1862b">LAST_VALUE 冲突在 channels/last_value.py:56 抛出；reducer 折叠在 channels/binop.py:143 执行</text>
</svg>
