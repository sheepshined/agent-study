<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6b7b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="400" fill="#fafbfc"/>
  <text x="440" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#24292f">7 个 hook 事件 + 工作区 hook 信任状态机</text>

  <!-- lifecycle -->
  <rect x="40" y="56" width="800" height="96" rx="10" fill="#eef4fb" stroke="#4a78b5" stroke-width="2"/>
  <text x="62" y="80" font-size="13.5" font-weight="bold" fill="#2b5985">hook 生命周期轴（contracts/src/hooks/index.ts:7-15，7 事件）</text>
  <g font-size="11.5" fill="#24292f">
    <text x="62" y="104">SessionStart ──▶ UserPromptSubmit ──▶ PreToolUse ──▶ PermissionRequest ──▶ [执行] ──▶ PostToolUse / PostToolUseFailure ──▶ Stop</text>
    <text x="62" y="132" fill="#b35900">exit 2 = block（阻断）；stdout JSON 表态；PreToolUse 能 deny，但不能改写权限决策对象（s04 冻结）</text>
  </g>

  <!-- trust state machine -->
  <rect x="40" y="172" width="500" height="192" rx="10" fill="#eefaf0" stroke="#3d9a50" stroke-width="2"/>
  <text x="290" y="198" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c7a3f">工作区 hook 信任状态机（workspace-hook-trust-evaluation.ts:15-52）</text>
  <g font-size="12" font-family="Consolas, monospace" fill="#24292f">
    <text x="70" y="226">pending_trust ──用户信任──▶ trusted_persistent</text>
    <text x="70" y="252">　　　│ digest 变更　　　　　　　　│ digest 变更</text>
    <text x="70" y="278">　　　▼　　　　　　　　　　　　　　▼</text>
    <text x="70" y="304" fill="#a83a32">stale_digest ◀────────────────── 自动失效</text>
    <text x="70" y="332">blocked_policy ｜ blocked_untrusted ｜ revoked（可撤销）</text>
  </g>
  <text x="290" y="356" text-anchor="middle" font-size="11" fill="#2c7a3f">信任键 = workspaceIdentity + "\0" + hookDeclarationDigest（:66-67）—— 信任跟内容走，不跟路径走</text>

  <!-- strip -->
  <rect x="570" y="172" width="270" height="192" rx="10" fill="#fdf6ec" stroke="#c98a2b" stroke-width="2"/>
  <text x="705" y="198" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5a12">未信任 = 没进跑道（:61-75）</text>
  <g font-size="11.5" fill="#24292f">
    <text x="590" y="224">装配时剥掉未信任的项目 hook</text>
    <text x="590" y="248">诊断码 config_project_hooks_</text>
    <text x="590" y="270">pending_trust；命令 zcode hooks trust</text>
    <text x="590" y="300" font-weight="bold" fill="#8a5a12">同源纪律：</text>
    <text x="590" y="322">项目级 subagent md 的 permissionMode</text>
    <text x="590" y="344">被强制忽略（profile.ts:183-185）——</text>
  </g>
  <text x="705" y="360" text-anchor="middle" font-size="10.5" fill="#a83a32">仓库输入不可自我提权</text>

  <text x="440" y="390" text-anchor="middle" font-size="13" fill="#6a737d">对应真实源码：core/src/hooks/{workspace-hook-trust-evaluation,configured-runner,runner}.ts｜adapters/src/config/project-config.adapter.ts｜cli/src/hooks-trust-command.ts</text>
</svg>
