<svg xmlns="http://www.w3.org/2000/svg" width="870" height="440" viewBox="0 0 870 440" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6b7b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="870" height="440" fill="#fafbfc"/>
  <text x="435" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#24292f">权限：五层规则拍平 → findLast 双通配求值 → ask/reply 状态机</text>

  <!-- five layers -->
  <rect x="40" y="62" width="270" height="240" rx="10" fill="#eef4fb" stroke="#4a78b5" stroke-width="2"/>
  <text x="175" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b5985">五层叠加（顺序即优先级）</text>
  <rect x="60" y="102" width="230" height="32" rx="5" fill="#ffffff" stroke="#8fb3d9"/>
  <text x="175" y="123" text-anchor="middle" font-size="11.5" fill="#24292f">defaults（agent.ts:119-136）</text>
  <rect x="60" y="140" width="230" height="32" rx="5" fill="#ffffff" stroke="#8fb3d9"/>
  <text x="175" y="161" text-anchor="middle" font-size="11.5" fill="#24292f">agent 特例</text>
  <rect x="60" y="178" width="230" height="32" rx="5" fill="#ffffff" stroke="#8fb3d9"/>
  <text x="175" y="199" text-anchor="middle" font-size="11.5" fill="#24292f">用户 config</text>
  <rect x="60" y="216" width="230" height="32" rx="5" fill="#ffffff" stroke="#8fb3d9"/>
  <text x="175" y="237" text-anchor="middle" font-size="11.5" fill="#24292f">session 级参数</text>
  <rect x="60" y="254" width="230" height="32" rx="5" fill="#fdf3f3" stroke="#c98a8a"/>
  <text x="175" y="275" text-anchor="middle" font-size="11.5" fill="#8a3030">CLI 旗标：--yolo 一键全放</text>

  <!-- evaluate -->
  <path d="M 310 200 H 360" stroke="#5a6b7b" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="362" y="96" width="230" height="208" rx="10" fill="#eefaf0" stroke="#3d9a50" stroke-width="2"/>
  <text x="477" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c7a3f">evaluate（:44-52）</text>
  <rect x="380" y="136" width="194" height="76" rx="6" fill="#ffffff" stroke="#93c9a0"/>
  <text x="477" y="158" text-anchor="middle" font-size="11.5" fill="#24292f">rulesets.flat()</text>
  <text x="477" y="178" text-anchor="middle" font-size="11.5" fill="#24292f">.findLast(双通配命中)</text>
  <text x="477" y="198" text-anchor="middle" font-size="10" fill="#6a737d">permission ∧ pattern 都要匹配</text>
  <text x="477" y="234" text-anchor="middle" font-size="11.5" fill="#24292f">后写覆盖先写</text>
  <text x="477" y="256" text-anchor="middle" font-size="11.5" fill="#24292f">无匹配 → {action:"ask"}</text>
  <text x="477" y="284" text-anchor="middle" font-size="10.5" fill="#6a737d">Wildcard：* → .*，? → .，全串锚定</text>

  <!-- state machine -->
  <path d="M 592 200 H 642" stroke="#5a6b7b" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="644" y="62" width="186" height="352" rx="10" fill="#fdf3e7" stroke="#d9a03c" stroke-width="2"/>
  <text x="737" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a5a00">审批状态机</text>
  <rect x="660" y="102" width="154" height="58" rx="6" fill="#ffffff" stroke="#e3c088"/>
  <text x="737" y="124" text-anchor="middle" font-size="11.5" fill="#24292f">deny → 立即失败</text>
  <text x="737" y="144" text-anchor="middle" font-size="11.5" fill="#24292f">allow → 直接放行</text>
  <rect x="660" y="168" width="154" height="76" rx="6" fill="#ffffff" stroke="#e3c088"/>
  <text x="737" y="190" text-anchor="middle" font-size="11.5" fill="#24292f">ask → 发事件 +</text>
  <text x="737" y="210" text-anchor="middle" font-size="11.5" fill="#24292f">Deferred.await 挂起</text>
  <text x="737" y="230" text-anchor="middle" font-size="10" fill="#6a737d">（:67-107，整轮停住）</text>
  <rect x="660" y="252" width="154" height="140" rx="6" fill="#ffffff" stroke="#e3c088"/>
  <text x="737" y="274" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#24292f">reply（:109-167）</text>
  <text x="737" y="296" text-anchor="middle" font-size="11.5" fill="#24292f">once：放行这一条</text>
  <text x="737" y="318" text-anchor="middle" font-size="11.5" fill="#24292f">always：入 approved 缓存</text>
  <text x="737" y="336" text-anchor="middle" font-size="11.5" fill="#24292f">＋自动放行满足者</text>
  <text x="737" y="358" text-anchor="middle" font-size="11.5" fill="#8a3030">reject：级联拒绝</text>
  <text x="737" y="378" text-anchor="middle" font-size="11.5" fill="#8a3030">同 session 全部 pending</text>

  <text x="435" y="428" text-anchor="middle" font-size="12" fill="#6a737d">Rule = {permission, pattern, action}；求值一行，复杂度都在 pattern 的生成（tree-sitter + arity 字典）</text>
</svg>
