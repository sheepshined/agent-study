<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 400" width="870" height="400" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect x="0" y="0" width="870" height="400" fill="#f4f7fa"/>
  <text x="435" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">s05　时间旅行：回放与分叉，铁轨是检查点链</text>

  <!-- 原线 -->
  <rect x="40" y="60" width="790" height="120" rx="10" fill="#ffffff" stroke="#7f9db9" stroke-width="2"/>
  <text x="60" y="84" font-size="13.5" font-weight="bold" fill="#34495e">原线（thread_id="main"）</text>
  <line x1="70" y1="140" x2="790" y2="140" stroke="#95a5a6" stroke-width="2"/>

  <circle cx="110" cy="140" r="7" fill="#85c1e9"/><text x="110" y="122" text-anchor="middle" font-size="11" fill="#2471a3">#0 input</text>
  <circle cx="290" cy="140" r="7" fill="#48c9b0"/><text x="290" y="122" text-anchor="middle" font-size="11" fill="#148f77">#1 plan=方案A</text>
  <circle cx="490" cy="140" r="7" fill="#48c9b0"/><text x="490" y="122" text-anchor="middle" font-size="11" fill="#148f77">#2 review</text>
  <circle cx="690" cy="140" r="7" fill="#48c9b0"/><text x="690" y="122" text-anchor="middle" font-size="11" fill="#148f77">#3 archive</text>

  <text x="290" y="166" text-anchor="middle" font-size="10.5" fill="#95a5a6">step1</text>
  <text x="490" y="166" text-anchor="middle" font-size="10.5" fill="#95a5a6">step2</text>
  <text x="690" y="166" text-anchor="middle" font-size="10.5" fill="#95a5a6">step3</text>

  <!-- 回放 -->
  <path d="M 290 140 C 290 220, 250 220, 290 250" fill="none" stroke="#8e44ad" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#ar5)"/>
  <text x="150" y="215" font-size="12" fill="#8e44ad">回放：把 #1 装回引擎重跑</text>
  <text x="150" y="233" font-size="11" fill="#8e44ad">同档+同函数 → 后续逐拍相同（BSP 确定性）</text>

  <!-- 分叉 -->
  <path d="M 290 140 C 420 100, 560 100, 660 210" fill="none" stroke="#af601a" stroke-width="2" marker-end="url(#ar5)"/>
  <text x="470" y="86" font-size="12" fill="#af601a">分叉：取 #1，手改 plan=方案B，存 fork 档（_loop.py:987）</text>

  <rect x="620" y="200" width="210" height="120" rx="10" fill="#fef5e7" stroke="#f0b27a"/>
  <text x="725" y="224" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#af601a">分叉线（同一 thread）</text>
  <text x="640" y="248" font-size="11.5" fill="#7b5232">fork 档: plan=方案B</text>
  <text x="640" y="268" font-size="11.5" fill="#7b5232">step2′: reviewer 重算 ✓</text>
  <text x="640" y="288" font-size="11.5" fill="#7b5232">step3′: archiver 重算 ✓</text>
  <text x="640" y="308" font-size="11.5" fill="#7b5232">planner 没有重跑（写入记在它名下）</text>

  <!-- 底部机制 -->
  <rect x="40" y="330" width="790" height="52" rx="8" fill="#f5eef8" stroke="#b3a6dc"/>
  <text x="435" y="351" text-anchor="middle" font-size="13" fill="#5b4a9e">重算范围不是人指定的——被改通道版本前进，引擎按版本差分自动找出"谁要重跑"（s02 的规则原样生效）</text>
  <text x="435" y="371" text-anchor="middle" font-size="11.5" fill="#7d5f9e">官方 API：get_state_history（main.py:1491）· update_state(as_node=...) · 携带 fork 档 invoke</text>

  <defs>
    <marker id="ar5" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8e44ad"/>
    </marker>
  </defs>
</svg>
